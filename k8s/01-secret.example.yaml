apiVersion: v1
kind: Secret
metadata:
  name: chatapp-secret
  labels:
    app.kubernetes.io/part-of: chatapp
type: Opaque
stringData:
  JWT_SECRET: "your-jwt-secret-key-at-least-32-chars"
  JWT_REFRESH_SECRET: "your-jwt-refresh-secret-key-at-least-32-chars"
  INTERNAL_API_TOKEN: "your-internal-api-token"
  RABBITMQ_URL: "amqps://user:password@host/vhost"
  REDIS_URL: "rediss://default:password@host:port"
  MONGO_URL: "mongodb+srv://user:password@host/database"
  USER_DB_URL: "postgresql://user:password@host:5432/postgres"
  AUTH_DB_URL: "mysql://user:password@host:3306/database"
  PUSHER_APP_ID: "your-pusher-app-id"
  PUSHER_KEY: "your-pusher-key"
  PUSHER_SECRET: "your-pusher-secret"
  PUSHER_CLUSTER: "your-pusher-cluster"
  MEILISEARCH_MASTER_KEY: "your-meilisearch-master-key"
